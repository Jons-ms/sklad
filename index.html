<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Інвентар</title>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#f5f5f7;color:#222}
.container{max-width:900px;margin:auto;padding:20px}
h1{margin:0}.header-row{display:flex;justify-content:space-between;align-items:center;margin-bottom:20px}
.location-switch{display:flex;gap:8px;background:#fff;padding:6px;border-radius:14px;margin-bottom:20px;box-shadow:0 2px 8px rgba(0,0,0,.05)}
.location-switch button{flex:1;background:transparent;color:#555;border:none}
.location-switch button.active{background:#222;color:#fff}
.top{display:flex;gap:10px;margin-bottom:20px}
input,select,button{font-size:16px;border-radius:10px;padding:12px;border:1px solid #ddd;min-width:0}
.search{flex:1}button{cursor:pointer;background:#222;color:#fff;border:none}
button:hover{opacity:.85}
.stats{display:flex;gap:10px;margin-bottom:20px}
.stat{background:#fff;border-radius:15px;padding:15px;flex:1;box-shadow:0 2px 8px rgba(0,0,0,.05)}
.stat strong{display:block;font-size:24px}
.product{background:#fff;padding:16px;border-radius:15px;margin-bottom:10px;display:flex;justify-content:space-between;align-items:center;box-shadow:0 2px 8px rgba(0,0,0,.05)}
.product-info h3{margin:0 0 5px}.category{color:#777;font-size:14px}.location{color:#555;font-size:13px;margin-top:3px}
.quantity{font-size:22px;font-weight:bold}.low{color:#d35400}
.controls{display:flex;gap:7px;align-items:center}.controls button{width:42px;height:42px;padding:0}
.delete{background:#c0392b}
.more-button{width:48px;padding:12px 0}
.zero-indicator{display:inline-block;width:9px;height:9px;background:#e53935;border-radius:50%;margin-left:7px;vertical-align:middle}
.minimum-indicator{display:inline-block;width:9px;height:9px;background:#f4c542;border-radius:50%;margin-left:7px;vertical-align:middle}
.controls button{user-select:none;-webkit-user-select:none;touch-action:none}
.more-panel{position:fixed;inset:0;background:rgba(0,0,0,.35);display:none;align-items:flex-end;justify-content:center;z-index:20}
.more-panel.active{display:flex}
.more-card{background:#fff;width:min(560px,100%);max-height:82vh;overflow:auto;border-radius:22px 22px 0 0;padding:20px}
.more-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:15px}
.more-header h2{margin:0}
.icon-button{background:#eee;color:#222;width:40px;height:40px;padding:0}
.more-item{width:100%;background:#f7f7f8;color:#222;text-align:left;margin-bottom:10px}
.more-section{display:none}
.more-section.active{display:block}
.back-button{background:#eee;color:#222;margin-bottom:15px}
.history-item{padding:12px 0;border-bottom:1px solid #eee}
.history-item:last-child{border-bottom:0}
.history-main{font-weight:600}
.history-meta{font-size:13px;color:#777;margin-top:3px}
.user-row{display:flex;gap:10px}
.user-row input{flex:1}
.empty{color:#777;text-align:center;padding:25px}
.add-form{background:#fff;padding:20px;border-radius:15px;margin-bottom:20px;display:none}
.add-form.active{display:block}.form-row{display:flex;gap:10px;margin-bottom:10px}
.form-row>*{flex:1;min-width:0}
@media(max-width:600px){
.container{padding:14px}.top{flex-direction:column}.stats{flex-direction:column}
.product{flex-direction:column;align-items:flex-start;gap:15px}.controls{width:100%}.controls button{flex:1}
.form-row{display:grid;grid-template-columns:1fr 1fr;gap:8px}.form-row:first-of-type{grid-template-columns:1fr}
.form-row>*{width:100%;min-width:0}#quantity{grid-column:1}#unit{grid-column:2}#minimum{grid-column:1 / -1}.add-form button{width:100%}
}
</style>
</head>
<body>
<div class="container">
<div class="header-row"><h1>📦 Інвентар</h1><button class="more-button" onclick="openMore()" aria-label="Більше">⋯</button></div>
<div class="location-switch">
<button id="warehouseButton" class="active" onclick="switchLocation('warehouse')">📦 Склад</button>
<button id="homeButton" onclick="switchLocation('home')">🏠 Дім</button>
</div>
<div class="top">
<input id="search" class="search" placeholder="🔍 Пошук товару..." oninput="render()">
<select id="categoryFilter" onchange="render()"></select>
<button onclick="toggleForm()">＋ Додати</button>
</div>
<div id="addForm" class="add-form">
<h2 id="formTitle">Новий товар — Склад</h2>
<div class="form-row"><input id="name" placeholder="Назва товару"><select id="category"></select></div>
<div class="form-row"><input id="quantity" type="number" min="0" placeholder="Кількість"><input id="unit" placeholder="Одиниця: шт, кг, л..."><input id="minimum" type="number" min="0" placeholder="Мінімум"></div>
<button onclick="addProduct()">Зберегти товар</button>
</div>
<div class="stats"><div class="stat"><strong id="productCount">0</strong>товарів</div><div class="stat"><strong id="lowCount">0</strong>закінчується</div></div>
<div id="products"></div>
</div>
<div id="morePanel" class="more-panel" onclick="closeMore(event)">
  <div class="more-card" onclick="event.stopPropagation()">
    <div class="more-header"><h2>Більше</h2><button class="icon-button" onclick="closeMore()">×</button></div>
    <div id="moreMenu">
      <button class="more-item" onclick="showMoreSection('history')">📜 Історія змін</button>
      <button class="more-item" onclick="showMoreSection('user')">👤 Користувач</button>
    </div>
    <div id="historySection" class="more-section">
      <button class="back-button" onclick="backToMore()">← Назад</button>
      <h3>Історія змін</h3>
      <div id="historyList"></div>
    </div>
    <div id="userSection" class="more-section">
      <button class="back-button" onclick="backToMore()">← Назад</button>
      <h3>Користувач</h3>
      <div class="user-row">
        <input id="userName" placeholder="Введи ім'я">
        <button onclick="saveUserName()">Зберегти</button>
      </div>
      <p id="userSaved" class="history-meta"></p>
    </div>
  </div>
</div>
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.2.1/firebase-app.js";
import { getDatabase, ref, push, set, onValue, remove } from "https://www.gstatic.com/firebasejs/12.2.1/firebase-database.js";
const firebaseConfig={apiKey:"AIzaSyDe6jj7XQctQvIsoWJyBvKl3TQ5wy14CCU",authDomain:"scladchyk.firebaseapp.com",databaseURL:"https://scladchyk-default-rtdb.europe-west1.firebasedatabase.app",projectId:"scladchyk",storageBucket:"scladchyk.firebasestorage.app",messagingSenderId:"126345381398",appId:"1:126345381398:web:f3beb86fd859064e58d737"};
const app=initializeApp(firebaseConfig);const db=getDatabase(app);
let currentLocation="warehouse",products=[],warehouseProducts=[],homeProducts=[],unsubscribeWarehouse=null,unsubscribeHome=null,historyEntries=[];
const locationPaths={warehouse:"products",home:"homeProducts"};
const warehouseCategories=["Продукти","Побутова хімія","Інструменти","Закрутки","Інше"];
const homeCategories=["Продукти","Побутова хімія","Інструменти","Інше"];

function updateCategories(){
const categories=currentLocation==="warehouse"?warehouseCategories:homeCategories;
document.getElementById("categoryFilter").innerHTML='<option value="all">Усі категорії</option>'+categories.map(c=>'<option value="'+c+'">'+c+'</option>').join("");
document.getElementById("category").innerHTML=categories.map(c=>'<option value="'+c+'">'+c+'</option>').join("");
}
function switchLocation(location){
currentLocation=location;
document.getElementById("warehouseButton").classList.toggle("active",location==="warehouse");
document.getElementById("homeButton").classList.toggle("active",location==="home");
document.getElementById("formTitle").textContent=location==="warehouse"?"Новий товар — Склад":"Новий товар — Дім";
document.getElementById("search").value="";document.getElementById("categoryFilter").value="all";document.getElementById("addForm").classList.remove("active");
updateCategories();render();
}
window.switchLocation=switchLocation;

function startListeners(){
if(unsubscribeWarehouse)unsubscribeWarehouse();if(unsubscribeHome)unsubscribeHome();
unsubscribeWarehouse=onValue(ref(db,"products"),snapshot=>{
const data=snapshot.val()||{};
warehouseProducts=Object.entries(data).map(([id,product])=>({id,...product,location:"Склад",locationKey:"warehouse"}));
render();
},error=>{
console.error("Помилка читання Складу:",error);
alert("Не вдалося завантажити товари зі Складу. Перевір правила доступу Firebase.");
});
onValue(ref(db,"history"),snapshot=>{
const data=snapshot.val()||{};
historyEntries=Object.entries(data).map(([id,item])=>({id,...item}));
if(document.getElementById("historySection").classList.contains("active"))renderHistory();
},error=>console.error("Помилка читання історії:",error));
unsubscribeHome=onValue(ref(db,"homeProducts"),snapshot=>{
const data=snapshot.val()||{};
homeProducts=Object.entries(data).map(([id,product])=>({id,...product,location:"Дім",locationKey:"home"}));
render();
},error=>{
console.error("Помилка читання Дому:",error);
alert("Не вдалося завантажити товари з Дому. Перевір правила доступу Firebase.");
});
}
function toggleForm(){document.getElementById("addForm").classList.toggle("active")}window.toggleForm=toggleForm;

function getUserName(){return localStorage.getItem("skladchykUserName")||"Користувач";}
function formatHistoryTime(timestamp){return new Date(timestamp).toLocaleString("uk-UA",{day:"2-digit",month:"2-digit",hour:"2-digit",minute:"2-digit"});}
async function addHistory(action,productName,location,details,delta=0){
  try{
    const entries=Object.values(historyEntries||{});
    const user=getUserName();
    const now=Date.now();
    const existing=entries.find(item=>item.type==="quantity"&&item.productName===productName&&item.location===location&&item.user===user&&item.action==="Зміна кількості");
    if(action==="Додано"||action==="Віднято"){
      if(existing){
        const newDelta=(Number(existing.delta)||0)+Number(delta);
        await set(ref(db,"history/"+existing.id),{...existing,delta:newDelta,details:details,timestamp:now});
      }else{
        const newRef=push(ref(db,"history"));
        await set(newRef,{type:"quantity",action:"Зміна кількості",productName,location,details,user,timestamp:now,delta:Number(delta)});
      }
    }else{
      const newRef=push(ref(db,"history"));
      await set(newRef,{type:"event",action,productName,location,details,user,timestamp:now});
    }
  }catch(error){console.error("History error:",error);}
}
function openMore(){document.getElementById("morePanel").classList.add("active");backToMore();}
function closeMore(event){if(event&&event.target!==event.currentTarget)return;document.getElementById("morePanel").classList.remove("active");}
function showMoreSection(section){document.getElementById("moreMenu").style.display="none";document.querySelectorAll(".more-section").forEach(el=>el.classList.remove("active"));document.getElementById(section+"Section").classList.add("active");if(section==="history")renderHistory();if(section==="user"){document.getElementById("userName").value=localStorage.getItem("skladchykUserName")||"";document.getElementById("userSaved").textContent=localStorage.getItem("skladchykUserName")?"Поточний користувач: "+localStorage.getItem("skladchykUserName"):"";}}
function backToMore(){document.getElementById("moreMenu").style.display="block";document.querySelectorAll(".more-section").forEach(el=>el.classList.remove("active"));}
function saveUserName(){const name=document.getElementById("userName").value.trim();if(!name){alert("Введи ім'я");return;}localStorage.setItem("skladchykUserName",name);document.getElementById("userSaved").textContent="Поточний користувач: "+name;}
function renderHistory(){const list=document.getElementById("historyList");if(!historyEntries.length){list.innerHTML='<div class="empty">Історія поки порожня.</div>';return;}list.innerHTML="";historyEntries.slice().sort((a,b)=>(b.timestamp||0)-(a.timestamp||0)).forEach(item=>{const row=document.createElement("div");row.className="history-item";const main=document.createElement("div");main.className="history-main";main.textContent=item.productName+" — "+item.action;const meta=document.createElement("div");meta.className="history-meta";meta.textContent=(item.type==="quantity" ? ((Number(item.delta)||0)>0 ? "+"+(Number(item.delta)||0) : String(Number(item.delta)||0))+" "+(item.details||"") : item.details)+" · "+item.location+" · "+(item.user||"Користувач")+" · "+formatHistoryTime(item.timestamp||Date.now());row.append(main,meta);list.appendChild(row);});}
window.openMore=openMore;window.closeMore=closeMore;window.showMoreSection=showMoreSection;window.backToMore=backToMore;window.saveUserName=saveUserName;

async function addProduct(){
const name=document.getElementById("name").value.trim(),category=document.getElementById("category").value,quantity=Number(document.getElementById("quantity").value),unit=document.getElementById("unit").value.trim()||"шт",minimum=Number(document.getElementById("minimum").value);
if(!name){alert("Введи назву товару");return}
if(quantity<0||minimum<0||!Number.isFinite(quantity)||!Number.isFinite(minimum)){alert("Кількість і мінімум не можуть бути від'ємними");return}
try{
const newProductRef=push(ref(db,locationPaths[currentLocation]));
const newProduct={id:newProductRef.key,name,category,quantity,unit,minimum,location:currentLocation==="warehouse"?"Склад":"Дім",locationKey:currentLocation};
await set(newProductRef,{name,category,quantity,unit,minimum});

// Firebase onValue() є єдиним джерелом актуального списку.
// Не додаємо товар вручну в локальний масив, щоб він не дублювався.

await addHistory("Додано",name,currentLocation==="warehouse"?"Склад":"Дім","Кількість: "+quantity+" "+unit);
document.getElementById("name").value="";document.getElementById("quantity").value="";document.getElementById("unit").value="";document.getElementById("minimum").value="";toggleForm();
}catch(error){console.error("Помилка додавання товару:",error);const message=error?.code==="PERMISSION_DENIED"?"Firebase не дозволив запис. Перевір правила Realtime Database.":"Не вдалося зберегти товар. Код: "+(error?.code||"невідома помилка");alert(message)}
}
window.addProduct=addProduct;

async function changeQuantity(id,amount,locationKey=currentLocation){
const source=locationKey==="warehouse"?warehouseProducts:homeProducts;const product=source.find(p=>p.id===id);if(!product)return;
const newQuantity=Math.max(0,(Number(product.quantity)||0)+amount);
try{await set(ref(db,locationPaths[locationKey]+"/"+id+"/quantity"),newQuantity);await addHistory(amount>0?"Додано":"Віднято",product.name,locationKey==="warehouse"?"Склад":"Дім",(Number(product.quantity)||0)+" → "+newQuantity+" "+product.unit,amount)}
catch(error){console.error(error);alert("Не вдалося змінити кількість. Перевір підключення до Firebase.")}
}
window.changeQuantity=changeQuantity;

async function deleteProduct(id,locationKey=currentLocation){
const source=locationKey==="warehouse"?warehouseProducts:homeProducts;const product=source.find(p=>p.id===id);if(!product)return;
if(!confirm("Видалити цей товар?"))return;
try{await addHistory("Видалено",product.name,locationKey==="warehouse"?"Склад":"Дім","Було: "+product.quantity+" "+product.unit);await remove(ref(db,locationPaths[locationKey]+"/"+id))}
catch(error){console.error(error);alert("Не вдалося видалити товар.")}
}
window.deleteProduct=deleteProduct;

let activeQuantityPress=null;
function stopActiveQuantityPress(){
  if(!activeQuantityPress)return;
  if(activeQuantityPress.timer)clearTimeout(activeQuantityPress.timer);
  if(activeQuantityPress.repeatTimer)clearInterval(activeQuantityPress.repeatTimer);
  activeQuantityPress=null;
}
document.addEventListener("pointerup",()=>{
  if(!activeQuantityPress)return;
  const press=activeQuantityPress;
  if(press.timer){
    clearTimeout(press.timer);
    activeQuantityPress=null;
    press.action();
  }else{
    stopActiveQuantityPress();
  }
});
document.addEventListener("pointercancel",stopActiveQuantityPress);

function addQuantityLongPress(button,action){
  button.addEventListener("pointerdown",event=>{
    if(event.button!==undefined&&event.button!==0)return;
    stopActiveQuantityPress();
    const press={action,timer:null,repeatTimer:null};
    activeQuantityPress=press;
    press.timer=setTimeout(()=>{
      if(activeQuantityPress!==press)return;
      press.timer=null;
      press.action();
      if(activeQuantityPress===press)press.repeatTimer=setInterval(()=>{
        if(activeQuantityPress===press)press.action();
      },200);
    },500);
  });
}
function render(){
const container=document.getElementById("products"),search=document.getElementById("search").value.trim().toLowerCase(),category=document.getElementById("categoryFilter").value;
const currentSource=currentLocation==="warehouse"?warehouseProducts:homeProducts;
const source=search?([...warehouseProducts,...homeProducts]):currentSource;
const filtered=source.filter(product=>(product.name||"").toLowerCase().includes(search)&&(category==="all"||product.category===category));
container.innerHTML="";
filtered.forEach(product=>{
const quantityValue=Number(product.quantity)||0;
const minimumValue=Number(product.minimum)||0;
const isZero=quantityValue===0,isMinimum=!isZero&&quantityValue===minimumValue,element=document.createElement("div");element.className="product";
const info=document.createElement("div");info.className="product-info";
const title=document.createElement("h3");title.textContent=product.name;
const categoryEl=document.createElement("div");categoryEl.className="category";categoryEl.textContent=product.category;
const locationEl=document.createElement("div");locationEl.className="location";locationEl.textContent="📍 "+product.location;locationEl.style.display=search?"block":"none";
const status=document.createElement("span");
if(isZero){status.className="zero-indicator";status.title="Товар закінчився";}
else if(isMinimum){status.className="minimum-indicator";status.title="Мінімальний рівень";}
title.appendChild(status);info.append(title,categoryEl,locationEl);
const controls=document.createElement("div");controls.className="controls";
const minus=document.createElement("button");minus.type="button";minus.textContent="−";addQuantityLongPress(minus,()=>changeQuantity(product.id,-1,product.locationKey));
const quantity=document.createElement("div");quantity.className="quantity";quantity.textContent=product.quantity+" "+product.unit;
const plus=document.createElement("button");plus.type="button";plus.textContent="+";addQuantityLongPress(plus,()=>changeQuantity(product.id,1,product.locationKey));
const del=document.createElement("button");del.type="button";del.className="delete";del.textContent="🗑";del.addEventListener("click",()=>deleteProduct(product.id,product.locationKey));
controls.append(minus,quantity,plus,del);element.append(info,controls);container.appendChild(element);
});
document.getElementById("productCount").textContent=search?filtered.length:currentSource.length;
document.getElementById("lowCount").textContent=(search?filtered:currentSource).filter(p=>Number(p.quantity)<=Number(p.minimum)).length;
}
window.render=render;
updateCategories();startListeners();switchLocation("warehouse");
</script>
</body>
</html>
